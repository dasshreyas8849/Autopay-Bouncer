<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autopay Bouncer</title>
<style>
:root{--bg:#eef2f5;--fg:#13222e;--mut:#5b6b78;--line:#c9d3db;--ac:#0a6e6e;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10191f;--fg:#e8eef2;--mut:#93a4b1;--line:#2b3b46;--ac:#4fc3c3;--bad:#ff8a80}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,serif}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font:700 28px/1.2 Georgia,serif;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 24px}
.row{border-top:1px solid var(--line);padding:16px 0;display:grid;gap:8px}
.top{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.row p{margin:0}.mut{color:var(--mut);font-size:14px}
button{font:600 14px system-ui;padding:8px 14px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);border-radius:4px;cursor:pointer}
button.alt{background:none;color:var(--fg);border-color:var(--line)}button:focus-visible{outline:3px solid var(--fg)}
.acts{display:flex;gap:8px}pre{font:13px/1.6 ui-monospace,monospace;color:var(--mut);white-space:pre-wrap}
</style>
<main><h1 id="h">Checking your subscriptions…</h1><p class="sub" id="s"></p><div id="list"></div>
<h2 style="font-size:16px;margin-top:32px">Actions taken</h2><pre id="log">Nothing yet.</pre></main>
<script>
const $=id=>document.getElementById(id);
async function load(){
  const d=await (await fetch('/api/state')).json(), p=d.findings.filter(f=>f.status==='pending');
  const t=p.reduce((a,f)=>a+f.saving,0);
  $('h').textContent=p.length?`You can stop paying up to $${t} a month.`:'Nothing left to review.';
  $('s').textContent=p.length?`${p.length} subscriptions need a decision. Nothing happens until you approve.`:'Every finding has been decided.';
  $('list').innerHTML=d.findings.map(f=>`<div class="row"><div class="top"><span>${f.name}</span><span>$${f.saving}/mo</span></div>
  <p>${f.reason}</p><p class="mut">Suggested: ${f.action} · ${f.status==='pending'?'waiting for you':f.status.replace('_',' ')}</p>
  ${f.status==='pending'?`<div class="acts"><button onclick="go('${f.id}','approve')">${f.action[0].toUpperCase()+f.action.slice(1)} ${f.name}</button><button class="alt" onclick="go('${f.id}','reject')">Keep it</button></div>`:f.status.startsWith('done')&&f.action==='suspend'?`<div class="acts"><button class="alt" onclick="undo('${f.id}')">Undo</button></div>`:''}</div>`).join('');
  if(d.log.length)$('log').textContent=d.log.map(l=>`${l.time}  ${l.what}  (${l.mode})`).join('\n');
}
async function go(id,v){const r=await fetch(`/api/findings/${id}/${v}`,{method:'POST'});if(!r.ok)alert((await r.json()).detail);load()}
async function undo(id){const r=await fetch(`/api/undo/${id}`,{method:'POST'});if(!r.ok)alert((await r.json()).detail);load()}
load();
</script></html>
